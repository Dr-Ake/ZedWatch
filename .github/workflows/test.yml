name: Test ZedWatch

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax checks
        run: npm run check
      - name: Run tests
        run: npm test
